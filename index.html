<style>
:root{--bg:#F5F3ED;--sur:#FFFFFF;--s2:#EDEAE0;--s3:#E3DFD1;--bd:#D2CDBE;--ink:#0F0D0A;--sub:#4A4740;--dim:#8A877C;--ac:#00A870;--acL:#E2F5ED;--acD:#007A52;--blue:#1A4FA0;--blueL:#ECF2FB;--red:#C01020;--redL:#FAF0F1;--amber:#B07020;--amberL:#FDF2E0;--purple:#6B3FA0;--purpleL:#F0EBF8;--teal:#007A8A;--tealL:#E0F4F6;--rose:#C0204A;--roseL:#FAF0F3;--green:#1A6A35;--greenL:#E6F5EC;--orange:#C05A10;--orangeL:#FDF0E5}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif;background:var(--bg);color:var(--ink);overflow:hidden;display:flex;justify-content:center}
#root{width:min(400px,100vw);height:100dvh;display:flex;flex-direction:column;background:var(--bg);position:relative}
#sb{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:var(--ink);color:#fff;font-size:13px;font-weight:700;flex-shrink:0;z-index:10}
#sb .logo{font-size:15px;letter-spacing:1.5px;cursor:pointer}
#scr{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:8px}
#nav{height:56px;display:flex;align-items:center;justify-content:space-around;background:var(--sur);border-top:1px solid var(--bd);flex-shrink:0;z-index:10;padding-bottom:env(safe-area-inset-bottom)}
.ntab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:9px;color:var(--dim);cursor:pointer;padding:4px 8px}.ntab.act{color:var(--ac)}.ntab svg{width:22px;height:22px}
.card{background:var(--sur);border-radius:14px;padding:16px;border:1px solid var(--bd);box-shadow:0 1px 5px rgba(0,0,0,.08);margin:8px 16px}
.btn{display:block;width:100%;padding:13px;border-radius:12px;font-size:14px;font-weight:700;text-align:center;cursor:pointer;border:none;transition:all .2s}
.btn-ac{background:var(--ac);color:#fff}.btn-ac:active{background:var(--acD)}
.btn-out{background:transparent;border:1.5px solid var(--bd);color:var(--sub)}.btn-out:active{background:var(--s2)}
.inp{width:100%;padding:11px 14px;border-radius:11px;border:1.5px solid var(--bd);font-size:14px;background:var(--sur);color:var(--ink);outline:none}.inp:focus{border-color:var(--ac)}
.tag{display:inline-block;font-size:9px;font-weight:800;padding:2px 7px;border-radius:4px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--ac);border-top-color:transparent;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.numline{position:relative;height:4px;background:var(--s3);border-radius:2px;margin:12px 0}
.ndot{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;transform:translate(-50%,-50%);border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.2);z-index:2}
.nlbl{position:absolute;top:-28px;transform:translateX(-50%);background:#fff;padding:2px 6px;border-radius:5px;font-size:9px;font-weight:700;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.prog{height:3px;background:var(--s3);border-radius:2px;overflow:hidden}.prog-bar{height:100%;background:var(--ac);transition:width .3s;border-radius:2px}
.qopt{padding:14px 16px;border:1.5px solid var(--bd);border-radius:12px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:all .2s;margin-bottom:8px}
.qopt .qk{width:28px;height:28px;border-radius:8px;background:var(--s2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--sub);flex-shrink:0}
.qopt.correct{border-color:var(--ac);background:var(--acL)}.qopt.correct .qk{background:var(--ac);color:#fff}
.qopt.wrong{border-color:var(--red);background:var(--redL)}.qopt.wrong .qk{background:var(--red);color:#fff}
.qopt.dimmed{opacity:.5}
.streak-badge{display:inline-flex;align-items:center;gap:4px;background:linear-gradient(135deg,#FF6B35,#FF3D00);color:#fff;font-size:12px;font-weight:800;padding:4px 10px;border-radius:20px}
.score-bump{display:inline-flex;align-items:center;gap:4px;background:var(--acL);color:var(--acD);font-size:11px;font-weight:700;padding:4px 10px;border-radius:8px;margin-top:8px}
.radar-bar{height:8px;border-radius:4px;background:var(--s3);overflow:hidden;margin:4px 0 8px}.radar-fill{height:100%;border-radius:4px;transition:width .5s}
.hero-quiz{background:linear-gradient(135deg,var(--ink) 0%,#1a2a1a 100%);color:#fff;padding:24px 16px}
.news-feat{position:relative;border-radius:14px;overflow:hidden;margin:8px 16px;height:180px;cursor:pointer}
.news-feat img{width:100%;height:100%;object-fit:cover}.news-feat .overlay{position:absolute;bottom:0;left:0;right:0;padding:16px;background:linear-gradient(transparent,rgba(0,0,0,.8));color:#fff}
.news-card{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--s2);cursor:pointer}
.news-card img{width:80px;height:60px;border-radius:8px;object-fit:cover;flex-shrink:0}
.brief-scroll{display:flex;gap:10px;overflow-x:auto;padding:0 16px 8px;-webkit-overflow-scrolling:touch}.brief-scroll::-webkit-scrollbar{display:none}
.brief-card{min-width:140px;max-width:140px;background:var(--sur);border-radius:10px;overflow:hidden;border:1px solid var(--bd);cursor:pointer;flex-shrink:0}
.brief-card img{width:100%;height:80px;object-fit:cover}.brief-card .bc-t{padding:8px;font-size:11px;font-weight:600;line-height:1.3}
.dot-ind{display:flex;gap:6px;justify-content:center}.dot-ind span{width:8px;height:8px;border-radius:50%;background:var(--s3);transition:all .3s}.dot-ind span.act{background:var(--ac);width:20px;border-radius:4px}
.fade-in{animation:fadeIn .3s ease}@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes popIn{0%{transform:scale(0)}60%{transform:scale(1.2)}100%{transform:scale(1)}}.pop-in{animation:popIn .4s ease}
.section-title{font-size:11px;font-weight:800;color:var(--dim);text-transform:uppercase;letter-spacing:1px;padding:16px 16px 8px}
.back-btn{padding:12px 16px;display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14px;font-weight:600}
.step-btn{padding:10px 16px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;border:1.5px solid var(--bd);background:var(--sur);text-align:center;margin-bottom:6px;transition:all .15s}
.step-btn:active,.step-btn.sel{background:var(--acL);border-color:var(--ac);color:var(--acD)}
.ad-slot{background:var(--s2);border:1px dashed var(--bd);border-radius:10px;padding:20px;text-align:center;margin:8px 16px;color:var(--dim);font-size:11px}
</style>

var NEWS=[
{id:1,cat:'政治',color:'var(--blue)',colorL:'var(--blueL)',hl:'高市首相、食料品消費税の段階的引き下げを表明 ── 2027年度に8%→5%、最終的にゼロ目標',img:'https://upload.wikimedia.org/wikipedia/commons/thumb/5/50/Kantei_Kanteichokushinku.jpg/640px-Kantei_Kanteichokushinku.jpg',date:'2026年4月14日',src:'NHK・時事通信',tags:['消費税','物価対策','食料品'],lead:'高市首相は14日の記者会見で、食料品にかかる消費税を2027年度から段階的に引き下げ、最終的にゼロを目指す方針を正式に表明した。与野党協議を経て今国会中の法改正を目指す。',summary:'物価高騰が長期化する中、家計への直接的な支援策として浮上したのが食料品消費税のゼロ化だ。現在の軽減税率8%をまず5%に引き下げ、2030年までにゼロにするロードマップが示された。財源には法人税の累進強化と金融所得課税の見直しが充てられる見通し。国民民主党や維新が賛成に回る一方、自民党内の財政規律派からは「社会保障財源が枯渇する」と強い反発が出ている。世論調査では賛成が67%に上り、政権の支持率を左右する大型政策になりそうだ。宮崎県では食費のエンゲル係数が全国平均を約3ポイント上回っており、この政策の恩恵が相対的に大きい地域とされる。',pro:'食料品は全国民が毎日購入するため、減税効果が即座に実感できる。特に収入に対する食費割合が高い低所得世帯・年金生活者・子育て世帯への恩恵が大きい。消費マインドの改善による経済の好循環も期待されている。イギリスやカナダなど食料品非課税の先進国も多く、国際的にも合理的な政策。',con:'年間約4〜6兆円の税収減が見込まれ、社会保障費の安定財源が失われるリスクがある。また高所得者ほど食費の絶対額が大きいため、金額ベースでは逆進性が解消しないとの指摘も。外食との線引きが複雑化し、事業者の事務負担増大も課題。',miy:'宮崎県は全国でもエンゲル係数が高い地域。県内のスーパーや直売所を利用する高齢者世帯にとっては月あたり数千円の負担軽減になる計算。一方で地元の食品加工業者からは「税率変更のシステム対応コストが痛い」との声も上がっている。'},
{id:2,cat:'政治',color:'var(--red)',colorL:'var(--redL)',hl:'防衛費GDP比2.5%へ ── 新田原基地にF-35B配備決定、宮崎で賛否',img:'https://upload.wikimedia.org/wikipedia/commons/thumb/5/57/Japan_Ground_Self-Defense_Force_Type_10_tanks_20120310.jpg/640px-Japan_Ground_Self-Defense_Force_Type_10_tanks_20120310.jpg',date:'2026年4月12日',src:'読売新聞・防衛省',tags:['防衛費','新田原基地','F-35B'],lead:'政府は2027年度予算で防衛費をGDP比2.5%とする方針を固めた。宮崎県新富町の新田原基地にはF-35Bステルス戦闘機の配備が正式決定し、地元では経済効果への期待と騒音問題への懸念が交錯している。',summary:'台湾海峡の緊張や北朝鮮の相次ぐミサイル発射を受け、岸田政権時代に決まったGDP比2%目標がさらに引き上げられた。2027年度は約15兆円規模となり、世界第3位の防衛予算に。新田原基地へのF-35B配備は南西防衛の要として位置づけられ、隊員約500名の増員と関連施設の建設が始まる。新富町は人口約1.6万人の小さな町で、基地関連の経済効果は年間数十億円と試算される一方、離着陸訓練による騒音は既存のF-15より大幅に増加する見込み。地元の商工会は歓迎ムードだが、農業従事者や子育て世帯からは不安の声が上がり、町議会でも議論が続いている。',pro:'東アジアの軍事バランスが急速に変化する中、抑止力の強化は不可欠。特に南西諸島防衛において新田原基地の戦略的重要性は高く、F-35Bの配備は日米同盟の信頼性向上にもつながる。地元経済への波及効果も大きい。',con:'防衛費増額は社会保障や教育予算の圧迫につながる。また基地強化は周辺国との緊張を高めるリスクもある。外交による信頼醸成を優先すべきとの意見も根強い。騒音や事故リスクなど基地周辺住民の生活環境悪化も深刻な問題。',miy:'新田原基地は宮崎県の主要な雇用拠点でもあり、F-35B配備による隊員増は地域経済にプラス。しかし基地周辺の農地では騒音による畜産への影響（乳量低下・ストレス）が懸念されている。新富町は防音工事への補助金拡充を国に要請中。'},
{id:3,cat:'政治',color:'var(--purple)',colorL:'var(--purpleL)',hl:'渡辺創氏、中道改革連合の代表に就任 ── 「地方から国を変える」宮崎モデルを全国に',img:'https://upload.wikimedia.org/wikipedia/commons/thumb/e/e0/Diet_of_Japan_Kokkai.jpg/640px-Diet_of_Japan_Kokkai.jpg',date:'2026年4月10日',src:'朝日新聞・毎日新聞',tags:['渡辺創','中道改革連合','地域主権'],lead:'2026年衆院選で宮崎1区から当選した渡辺創氏が中道改革連合の新代表に選出された。「永田町の論理ではなく、地方の現場から政策をつくる」と所信表明し、宮崎県を地域主権のモデルケースに据える構想を発表した。',summary:'渡辺氏は元宮崎県議で、2026年2月の衆院選で自民・武井俊輔氏を破り初当選。わずか2ヶ月で党代表に就任する異例のスピード出世となった。掲げる政策の柱は(1)農業の6次産業化と有機農業推進(2)再生可能エネルギー特区の創設(3)地方への権限・財源移譲の3点。「宮崎で成功したモデルを全国に広げる」と述べ、2027年参院選に向けた党勢拡大を宣言した。党内では若手議員から支持を集める一方、ベテラン議員からは「地方の成功体験が全国に通用するのか」との慎重論も出ている。',pro:'地方出身の若いリーダーが国政の中心に立つことで、東京一極集中の是正に向けた議論が加速する。農業や再エネなど地方の強みを活かした成長戦略は説得力がある。',con:'国政経験が浅く、外交・安全保障・マクロ経済政策での手腕は未知数。地方モデルの全国展開には制度的なハードルも多い。',miy:'渡辺氏の代表就任は宮崎県にとって明治以来の「地元出身の党代表」。県内では期待が高まる一方、「宮崎の問題を本当に国政で解決できるのか」と冷静に見る有権者も。有機農業特区構想は綾町や都城市の農家から具体的な要望が出始めている。'},
{id:4,cat:'宮崎',color:'var(--green)',colorL:'var(--greenL)',hl:'宮崎ガソリン180円突破 ── 農家の燃料費が前年比30%増、JAが緊急支援策',img:'https://upload.wikimedia.org/wikipedia/commons/thumb/a/a0/Miyazaki_beef_02.jpg/640px-Miyazaki_beef_02.jpg',date:'2026年4月13日',src:'宮崎日日新聞・西日本新聞',tags:['ガソリン','農業','畜産','物価'],lead:'宮崎県内のレギュラーガソリン平均価格が180円を突破した。公共交通が限られ自家用車依存度が全国トップクラスの宮崎では、通勤・通学から農業まであらゆる場面で家計を直撃。JA宮崎中央会は燃料費の緊急補助を決定した。',summary:'原油価格の高止まりに加え、円安の進行（1ドル=158円台）がガソリン価格を押し上げている。宮崎県は鉄道やバスの路線が少なく、県民の約8割が日常的に自動車を利用する「車社会」。通勤1日あたりの走行距離は全国平均の1.5倍に達し、月のガソリン代が2万円を超える世帯も珍しくない。農業では、ビニールハウスの暖房に使う重油、飼料の輸送に使うトラックの軽油など、燃料費が経営コストの大きな割合を占める。宮崎牛の生産者からは「子牛1頭あたりの飼育コストが10万円以上増えた」との声も。JA宮崎中央会は1農家あたり最大20万円の燃料費補助を決めたが、根本的な解決には政府のトリガー条項発動が必要との声が強い。',pro:'トリガー条項を発動しガソリン税（揮発油税25.1円/L）を一時停止すべき。地方の生活インフラとしてのガソリンは食料品と同様に軽減措置が必要。農業の競争力維持のためにも燃料費支援は急務。',con:'化石燃料への補助金は脱炭素の流れに逆行する。EV普及や再エネ導入への投資に振り向けるべき。トリガー条項発動は年間1.5兆円の税収減となり財政を圧迫する。',miy:'宮崎県の1世帯あたり自動車保有台数は全国5位。特に県南部の日南市・串間市では公共交通の選択肢がほぼなく、車がなければ病院にも行けない状況。高齢ドライバーの免許返納が進まない一因にもなっている。'},
{id:5,cat:'宮崎',color:'var(--green)',colorL:'var(--greenL)',hl:'宮崎県知事選2027、複数候補が浮上 ── 河野前知事の後継争い本格化',img:'https://upload.wikimedia.org/wikipedia/commons/thumb/b/b5/Miyazaki_Prefectural_Government_Office.jpg/640px-Miyazaki_Prefectural_Government_Office.jpg',date:'2026年4月9日',src:'宮崎日日新聞',tags:['知事選','県政','人口減少'],lead:'2027年1月の宮崎県知事選に向けて、元県議の右松健太氏が正式に出馬表明。他にも現職副知事や経済界からの擁立論があり、選挙戦の構図が固まりつつある。',summary:'現職の河野俊嗣知事は4期目を全うして退任する方針を示しており、16年ぶりの新人知事が誕生する見通し。右松氏は「人口減少を止める」を最大の公約に掲げ、(1)県内IT企業への税制優遇(2)子育て支援の大幅拡充(3)宮崎空港の国際線復活を打ち出した。一方、現職副知事の擁立を推す自民県連は「県政の安定的な継続」を重視。経済界からは宮崎銀行出身の実業家の名前も取り沙汰されている。宮崎県の人口は108万人を割り込み、2040年には90万人を下回る推計も。知事選の争点は人口減少対策と産業振興に絞られそうだ。',pro:'新しいリーダーシップで県政を刷新し、若者の県外流出を食い止める具体策が必要。IT企業誘致や国際線復活は宮崎の可能性を広げる。',con:'知事一人の力で人口減少は止められない。国の政策や経済構造の問題であり、地方自治体にできることには限界がある。実現可能性の低い公約で県民の期待を煽るべきではない。',miy:'宮崎県の転出超過は年間約3,000人。特に18〜24歳の若者が福岡・東京へ流出している。知事選は「宮崎に残る理由をつくれるか」が問われる選挙になる。'},
{id:6,cat:'宮崎',color:'var(--teal)',colorL:'var(--tealL)',hl:'JR日南線、南郷〜志布志間の廃止が事実上決定 ── BRT転換へ地元協議開始',img:'https://upload.wikimedia.org/wikipedia/commons/thumb/5/5e/JR_Kyushu_kiha47_at_Nichinan_Station.jpg/640px-JR_Kyushu_kiha47_at_Nichinan_Station.jpg',date:'2026年4月7日',src:'日本経済新聞・NHK宮崎',tags:['JR日南線','廃線','BRT','交通'],lead:'JR九州は日南線の南郷〜志布志間（約30km）について鉄道での維持を断念し、BRT（バス高速輸送システム）への転換を沿線自治体に正式提案した。1日の利用者が100人を下回る区間もあり、年間赤字は約8億円に達していた。',summary:'JR日南線は宮崎駅から鹿児島県の志布志駅を結ぶ全長88.9kmのローカル線。沿線には青島、鵜戸神宮、飫肥城下町など宮崎を代表する観光地が点在するが、利用者数はピーク時の1/5以下に落ち込んでいた。JR九州は宮崎〜南郷間は当面維持する方針だが、南郷〜志布志間はBRT転換を提案。BRTは専用道路を走るバスで、鉄道より運行コストが低く、ダイヤの柔軟性も高い。しかし沿線の串間市や志布志市の住民からは「鉄道がなくなれば地域が死ぬ」との反発が強く、高校生の通学手段としても重要。国土交通省の新制度「再構築協議会」のもとで、今後2年間かけて最終的な結論を出す。',pro:'BRT転換により運行コストを大幅に削減しつつ、路線自体は維持できる。停留所を増やすことで利便性が向上する可能性も。全国で成功例（気仙沼線BRTなど）もある。鉄道にこだわることが必ずしも住民の利益にはならない。',con:'鉄道は地域のアイデンティティであり観光資源でもある。一度廃止すれば復活はほぼ不可能。BRTでは観光客の誘客力が大幅に低下する。過疎化をさらに加速させ、沿線の不動産価値も下落する。',miy:'日南線沿線には県立高校が3校あり、約200名の高校生が通学に利用。BRT転換後も通学の足は確保される見通しだが、冬季の遅延や災害時の運休リスクは鉄道より高い。青島〜日南間の観光列車「海幸山幸」の存続も焦点に。'},
{id:7,cat:'経済',color:'var(--amber)',colorL:'var(--amberL)',hl:'2026年度農業予算2.3兆円 ── 宮崎牛の輸出支援に120億円、有機農業にも重点配分',img:'https://upload.wikimedia.org/wikipedia/commons/thumb/8/8f/Miyazaki_cattle_Mochikou.jpg/640px-Miyazaki_cattle_Mochikou.jpg',date:'2026年4月5日',src:'農林水産省・日本農業新聞',tags:['農業予算','宮崎牛','有機農業','輸出'],lead:'農林水産省は2026年度の農業関連予算が過去最大の2兆3,000億円になったと発表。このうち和牛を含む畜産物の輸出促進に120億円、有機農業の面積拡大に80億円が計上された。宮崎県は両分野で全国トップクラスの実績があり、重点支援地域に選定されている。',summary:'食料安全保障の強化が国策として位置づけられる中、農業予算は3年連続で過去最大を更新した。特に注目されるのが輸出支援と有機農業の2本柱。宮崎牛は2025年に年間輸出額100億円を突破し、和牛ブランドの先頭を走る存在。今回の予算ではEU・中東向けの認証取得支援、コールドチェーン（低温流通網）整備、海外での宮崎牛プロモーションに資金が投じられる。有機農業については、政府が2050年までに農地の25%を有機化する「みどりの食料システム戦略」を掲げており、宮崎県は綾町を中心に有機農業の先進地として全国のモデルに。都城市では畜産と有機農業を組み合わせた循環型農業の実証プロジェクトも始まっている。',pro:'農業を「補助金で守る産業」から「稼げる成長産業」に転換する好機。宮崎牛の世界的なブランド力は日本の大きな強み。有機農業は環境負荷軽減と高付加価値化の両立が可能。',con:'大規模農家への補助金偏重で、小規模家族経営が切り捨てられるリスク。輸出偏重は国内の食料供給を不安定にしかねない。有機農業の生産性は慣行農業の6〜7割にとどまり、移行期の農家負担も大きい。',miy:'宮崎県の農業産出額は全国5位。宮崎牛、マンゴー、きゅうり、ピーマンなどブランド農産物が多い。今回の予算は宮崎の農業にとって追い風だが、高齢化する農家の後継者不足という根本課題は予算だけでは解決しない。'},
{id:8,cat:'経済',color:'var(--orange)',colorL:'var(--orangeL)',hl:'4月の実質賃金、前年比+0.3%でプラス転換 ── ただし地方は恩恵薄く宮崎は-0.5%',img:'https://upload.wikimedia.org/wikipedia/commons/thumb/7/78/Aoshima_Island_Miyazaki.jpg/640px-Aoshima_Island_Miyazaki.jpg',date:'2026年4月11日',src:'厚生労働省・総務省',tags:['実質賃金','物価','地方経済','格差'],lead:'厚生労働省が発表した毎月勤労統計調査で、実質賃金が前年同月比+0.3%と4ヶ月ぶりにプラスに転じた。しかし大企業中心の賃上げであり、地方の中小企業や非正規労働者への波及は限定的。宮崎県では依然マイナス圏にとどまっている。',summary:'2026年春闘では大企業の賃上げ率が平均5.2%と33年ぶりの高水準を記録した。これを受けて全国の実質賃金はようやくプラスに転じたが、地域間格差は拡大している。宮崎県の最低賃金は全国最低水準の953円（2025年10月改定）で、平均月収は全国平均を約5万円下回る。観光業ではインバウンド需要の回復で売上は増加しているが、人手不足が深刻化し、外国人技能実習生に依存する構造が固定化しつつある。農業分野では飼料・燃料価格の高騰で実質的な手取りが減少しており、「名目賃金が上がっても物価がそれ以上に上がる」状況が続いている。',pro:'賃上げの流れが全国に波及すれば、消費回復と好循環が生まれる。最低賃金の引き上げを加速し、地方にも恩恵を届けるべき。政府のリスキリング支援で労働生産性を高めることも重要。',con:'中小企業の賃上げ余力は限られている。無理な賃上げは倒産や廃業を招く。地方経済の構造的な問題（生産性の低さ、人口減少）は賃上げだけでは解決しない。',miy:'宮崎県の有効求人倍率は1.2倍と人手不足が顕著だが、賃金水準が低いため県外に人材が流出する悪循環。特に介護・農業・観光の3分野で深刻。宮崎大学の卒業生の約6割が県外に就職している。'},
{id:9,cat:'経済',color:'var(--amber)',colorL:'var(--amberL)',hl:'宮崎牛、EU輸出が本格始動 ── パリの三ツ星レストランが採用、年間200億円市場へ',img:'https://upload.wikimedia.org/wikipedia/commons/thumb/a/a0/Miyazaki_beef_02.jpg/640px-Miyazaki_beef_02.jpg',date:'2026年4月3日',src:'農林水産省・宮崎県庁',tags:['宮崎牛','EU輸出','ブランド','農業'],lead:'宮崎牛のEU向け輸出が本格的に始動した。EUの厳格な衛生基準をクリアした県内の食肉処理施設から初出荷が行われ、パリの三ツ星レストラン3店舗での採用が決定。県は2030年までに年間輸出額200億円を目指す。',summary:'日本産和牛のEU輸出は2023年に解禁されたが、HACCPやトレーサビリティの基準が厳しく、対応できる施設は全国でもわずか。宮崎県はいち早く都城市の食肉処理施設をEU認定に対応させ、先行者利益を確保した。パリ、ロンドン、ミラノの高級レストランでの評価は極めて高く、「KOBEに匹敵するかそれ以上」との声も。現在の輸出先は米国・香港・シンガポールが中心で年間約110億円だが、EU・中東という新市場が加わることで2030年200億円は現実的な目標とされる。一方で、輸出量の増加に伴い国内市場への供給が減り、国内価格の上昇を懸念する声もある。県内の生産者からは「輸出でブランド価値が上がれば国内価格も適正化される」という前向きな意見と、「結局大手が儲かるだけで小規模農家には恩恵がない」という批判の両方が聞こえる。',pro:'世界市場での宮崎牛のブランド確立は、日本の農業輸出の象徴的成功例になりうる。高付加価値の輸出は農家の所得向上と地域経済の活性化に直結する。',con:'輸出偏重は国内消費者の負担増につながる。和牛の生産には大量の飼料と水が必要で、環境負荷の観点から無制限の増産には限界がある。小規模農家が輸出の恩恵を受けるための仕組みづくりが不足している。',miy:'宮崎県は和牛の生産額で全国2位。都城市は市町村別で全国1位の畜産都市。EU輸出により都城市だけで年間50億円の経済効果が見込まれている。県は「フードバレー宮崎」構想を掲げ、食の一大産地としての地位確立を目指す。'},
{id:10,cat:'社会',color:'var(--rose)',colorL:'var(--roseL)',hl:'宮崎県議会の女性議員が過去最多の7名に ── それでも全国38位、構造的課題は根深い',img:'https://upload.wikimedia.org/wikipedia/commons/thumb/9/9d/Miyazaki_City_Hall.jpg/640px-Miyazaki_City_Hall.jpg',date:'2026年4月1日',src:'宮崎日日新聞・西日本新聞',tags:['ジェンダー','女性議員','地方議会','政治参画'],lead:'2025年の統一地方選を経て、宮崎県議会の女性議員が過去最多の7名（全39議席中、17.9%）になった。しかし全国ランキングでは依然38位にとどまり、「政治は男性がするもの」という固定観念が根強い地方の課題が浮き彫りに。',summary:'内閣府の調査によれば、地方議会の女性比率が低い要因として「家庭との両立が困難」「選挙活動にかかるコストと時間」「ハラスメント」が上位に挙がる。宮崎県では特に農村部で「女性は家を守るべき」という価値観が残り、立候補自体のハードルが高い。一方で都市部の宮崎市や都城市では30〜40代の女性候補が善戦する傾向があり、世代間の意識差が鮮明になっている。県は女性の政治参画を促す「ウィメンズ政治スクール」を2025年に開講し、延べ80名が参加。受講者の中から次期市町村議選への立候補を検討する女性も出始めている。全国的にはクオータ制（候補者の一定割合を女性にする制度）の導入議論も進むが、宮崎県議会では「能力で選ぶべき」との反対論が多数を占めている。',pro:'多様な視点が政策に反映されることで、子育て・介護・DV対策など生活に密着した課題への対応が改善する。女性議員の増加は民主主義の質を高める。候補者均等法の実効性を強化し、政党に女性候補の擁立を義務づけるべき。',con:'クオータ制は逆差別であり、性別ではなく能力で選ばれるべき。形式的な数合わせは議会の質を下げかねない。女性自身が政治に関心を持つことが先であり、制度で強制すべきではない。',miy:'宮崎県の市町村議会では女性ゼロの自治体がまだ5つある。議員報酬が月15万円以下の町村では「仕事を辞めてまで立候補できない」のが現実。オンライン議会や育児中の議場入りなど、制度面の改革も求められている。'}

function startCD(){S.obMode='deep';S.obPhase='quiz';S.obIdx=0;S.obAns={};render();}
function startCQ(){S.obMode='quick';S.obPhase='quiz';S.obIdx=0;S.obAns={};render();}
function restartC(){S.obPhase='welcome';render();}
function showCResult(){S.obPhase='result';render();}
function cAns(i){var qs=S.obMode==='deep'?COMPASS_DEEP:COMPASS_QUICK;var q=qs[S.obIdx];if(!q)return;S.obAns[q.id]=i;setTimeout(function(){S.obIdx++;if(S.obIdx>=qs.length)finishC();render();},250);}
function cPrev(){if(S.obIdx>0){S.obIdx--;render();}}
function cSkip(){var qs=S.obMode==='deep'?COMPASS_DEEP:COMPASS_QUICK;S.obIdx++;if(S.obIdx>=qs.length)finishC();render();}
function closeSub(){S.settingsSub=null;render();}
function finishC(){
var qs=S.obMode==='deep'?COMPASS_DEEP:COMPASS_QUICK;
var axS={},axC2={};for(var i=0;i<qs.length;i++){var q=qs[i];var a=S.obAns[q.id];if(a===undefined)continue;if(!axS[q.axis]){axS[q.axis]=0;axC2[q.axis]=0;}axS[q.axis]+=(a+1);axC2[q.axis]++;}
var st={};for(var k in axS)st[k]=Math.round(axS[k]/axC2[k]);
var code=calcType(st);var ti=tInfo(code);
var ms=[];for(var c=0;c<CANDS.length;c++){var td=0,cn=0;for(var k in st){if(CANDS[c][k]!==undefined){td+=Math.abs(st[k]-CANDS[c][k]);cn++;}}ms.push(cn?Math.round((1-td/(4*cn))*100):50);}
var ps=[];for(var p=0;p<PARTIES.length;p++){var td=0,cn=0;for(var k in st){if(PARTIES[p][k]!==undefined){td+=Math.abs(st[k]-PARTIES[p][k]);cn++;}}ps.push(cn?Math.round((1-td/(4*cn))*100):50);}
S.profile={st:st,ms:ms,ps:ps};S.pType=code;S.obPhase='result';sv();}
